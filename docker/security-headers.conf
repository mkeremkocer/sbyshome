# nginx'te bir location icindeki add_header, ust seviyedeki tum add_header
# tanimlarini gecersiz kilar. Bu yuzden basliklar tek dosyada toplanip
# ihtiyac duyan her blokta include edilir.
add_header X-Content-Type-Options "nosniff"                     always;
add_header X-Frame-Options        "SAMEORIGIN"                  always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
