server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Turkce karakterler icin acik kodlama
    charset       utf-8;
    charset_types text/css application/javascript text/javascript text/plain image/svg+xml;

    include /etc/nginx/security-headers.conf;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/plain text/css application/javascript text/javascript image/svg+xml;

    # Saglik kontrolu — compose healthcheck bu uctan sorar
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok";
    }

    # Icerik dosyalari onbellege alinmaz: data/agents.js icindeki baglantilari
    # duzenleyip sayfayi yenilemek yeterli olsun diye.
    location /data/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Stil, betik ve gorseller uzun sure onbellekte kalabilir
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Tek sayfalik site: bilinmeyen yol 404 doner.
    # Ileride istemci tarafi yonlendirme eklerseniz burayi
    # "try_files $uri $uri/ /index.html;" yapin.
    location / {
        try_files $uri $uri/ =404;
    }
}
